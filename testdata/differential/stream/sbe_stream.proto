// SBE messages for the stream differential: a fixed block, and a block with a
// string and a repeating group.
syntax = "proto3";
package stream.v1;
import "sbe/annotations.proto";

option (sbe.schema_id) = 1;
option (sbe.version) = 0;

message Simple {
  option (sbe.template_id) = 2;
  uint32 id = 1;
  int32 value = 2;
}

message Order {
  option (sbe.template_id) = 1;
  uint64 order_id = 1;
  string symbol = 2 [(sbe.length) = 8];
  message Fill {
    int64 fill_price = 1;
    uint32 fill_qty = 2;
  }
  repeated Fill fills = 3;
}
