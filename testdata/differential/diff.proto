// Schema of the documents only this repo's differential run uses. They reach
// what the spec's fixtures don't: nested nulls, keys above ASCII, number and
// string spellings, and oneof byte order.

syntax = "proto3";
package diff.v1;

import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "pxf/annotations.proto";
import "pxf/bignum.proto";
import "pxf/secret.proto";

enum Color {
  COLOR_UNSPECIFIED = 0;
  RED = 1;
}

message Leaf {
  optional string label = 1;
  google.protobuf.StringValue wrapped = 2;
  Leaf child = 3;
  google.protobuf.Timestamp at = 4;
  oneof pick {
    string text = 5;
    int32 number = 6;
  }
  string after = 7;
}

message Numbers {
  float f = 1;
  double d = 2;
  repeated float fs = 3;
  repeated double ds = 4;
  optional int64 i = 5;
  uint64 u = 6;
}

message Root {
  optional string name = 1;
  Leaf leaf = 2;
  repeated Leaf items = 3;
  map<string, Leaf> by_key = 4;
  map<int32, Leaf> by_num = 5;
  map<bool, string> by_flag = 6;
  map<string, string> labels = 7;
  google.protobuf.Any any = 8;
  repeated google.protobuf.Any anys = 9;
  Numbers numbers = 10;
  string text = 11;
  bytes blob = 12;
  Color color = 13;
  repeated Color colors = 14;
  pxf.Secret secret = 15;
  repeated Leaf named = 16 [(pxf.key) = "label"];
  pxf.Decimal dec = 17;
  repeated string strs = 18;
  repeated pxf.Secret secrets = 19;
  map<string, pxf.Secret> secret_map = 20;
  string required_text = 21 [(pxf.required) = false, (pxf.default) = "dflt"];
  google.protobuf.FieldMask _null = 100;
}

message Plain {
  Leaf leaf = 1;
  repeated Leaf items = 2;
  optional string name = 3;
}

message Times {
  google.protobuf.Duration d = 1;
  repeated google.protobuf.Duration ds = 2;
  map<string, google.protobuf.Duration> m = 3;
}

message Vault {
  pxf.Secret pw = 1;
  repeated Vault nested = 2;
  map<string, Vault> by_host = 3;
  repeated pxf.Secret keys = 4;
  map<string, pxf.Secret> tenant = 5;
  google.protobuf.Any any = 6;
  string label = 7 [(pxf.default) = "unnamed"];
  string must = 8 [(pxf.required) = true];
}
