// Schema of the documents only this repo's differential run uses. They reach
// what the spec's fixtures don't: nested nulls, keys above ASCII, number and
// string spellings, and oneof byte order.

syntax = "proto3";
package diff.v1;

import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "pxf/annotations.proto";
import "pxf/bignum.proto";
import "pxf/secret.proto";

enum Color {
  COLOR_UNSPECIFIED = 0;
  RED = 1;
}

message Leaf {
  optional string label = 1;
  google.protobuf.StringValue wrapped = 2;
  Leaf child = 3;
  google.protobuf.Timestamp at = 4;
  oneof pick {
    string text = 5;
    int32 number = 6;
  }
  string after = 7;
}

message Numbers {
  float f = 1;
  double d = 2;
  repeated float fs = 3;
  repeated double ds = 4;
  optional int64 i = 5;
  uint64 u = 6;
}

message Root {
  optional string name = 1;
  Leaf leaf = 2;
  repeated Leaf items = 3;
  map<string, Leaf> by_key = 4;
  map<int32, Leaf> by_num = 5;
  map<bool, string> by_flag = 6;
  map<string, string> labels = 7;
  google.protobuf.Any any = 8;
  repeated google.protobuf.Any anys = 9;
  Numbers numbers = 10;
  string text = 11;
  bytes blob = 12;
  Color color = 13;
  repeated Color colors = 14;
  pxf.Secret secret = 15;
  repeated Leaf named = 16 [(pxf.key) = "label"];
  pxf.Decimal dec = 17;
  repeated string strs = 18;
  repeated pxf.Secret secrets = 19;
  map<string, pxf.Secret> secret_map = 20;
  string required_text = 21 [(pxf.required) = false, (pxf.default) = "dflt"];
  google.protobuf.FieldMask _null = 100;
}

// Every kind of field a default can land on, for the run over ApplyDefault.
message Kinds {
  string f_string = 1;
  bool f_bool = 2;
  int32 f_int32 = 3;
  sint32 f_sint32 = 4;
  sfixed32 f_sfixed32 = 5;
  int64 f_int64 = 6;
  sint64 f_sint64 = 7;
  sfixed64 f_sfixed64 = 8;
  uint32 f_uint32 = 9;
  fixed32 f_fixed32 = 10;
  uint64 f_uint64 = 11;
  fixed64 f_fixed64 = 12;
  float f_float = 13;
  double f_double = 14;
  bytes f_bytes = 15;
  Color f_enum = 16;
  google.protobuf.Timestamp f_timestamp = 17;
  google.protobuf.Duration f_duration = 18;
  google.protobuf.StringValue w_string = 19;
  google.protobuf.BoolValue w_bool = 20;
  google.protobuf.Int32Value w_int32 = 21;
  google.protobuf.Int64Value w_int64 = 22;
  google.protobuf.UInt32Value w_uint32 = 23;
  google.protobuf.UInt64Value w_uint64 = 24;
  google.protobuf.FloatValue w_float = 25;
  google.protobuf.DoubleValue w_double = 26;
  google.protobuf.BytesValue w_bytes = 27;
  pxf.BigInt f_bigint = 28;
  pxf.Decimal f_decimal = 29;
  pxf.BigFloat f_bigfloat = 30;
  Leaf f_message = 31;
  repeated int32 f_repeated = 32;
  map<string, string> f_map = 33;
}

message Plain {
  Leaf leaf = 1;
  repeated Leaf items = 2;
  optional string name = 3;
}

message Times {
  google.protobuf.Duration d = 1;
  repeated google.protobuf.Duration ds = 2;
  map<string, google.protobuf.Duration> m = 3;
}

message Vault {
  pxf.Secret pw = 1;
  repeated Vault nested = 2;
  map<string, Vault> by_host = 3;
  repeated pxf.Secret keys = 4;
  map<string, pxf.Secret> tenant = 5;
  google.protobuf.Any any = 6;
  string label = 7 [(pxf.default) = "unnamed"];
  string must = 8 [(pxf.required) = true];
}
