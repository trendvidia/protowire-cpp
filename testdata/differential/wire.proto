//
// Every wire shape SerializeGoOrder writes, so the differential run compares
// each against protobuf-go's bytes.

syntax = "proto2";
package wire.v1;

enum E {
  E_ZERO = 0;
  E_ONE = 1;
}

message Inner {
  optional int32 a = 1;
  oneof o {
    int32 x = 2;
    string y = 3;
  }
  optional int32 z = 4;
}

message All {
  optional double f_double = 1;
  optional float f_float = 2;
  optional int64 f_int64 = 3;
  optional uint64 f_uint64 = 4;
  optional int32 f_int32 = 5;
  optional fixed64 f_fixed64 = 6;
  optional fixed32 f_fixed32 = 7;
  optional bool f_bool = 8;
  optional string f_string = 9;
  optional bytes f_bytes = 12;
  optional uint32 f_uint32 = 13;
  optional E f_enum = 14;
  optional sfixed32 f_sfixed32 = 15;
  optional sfixed64 f_sfixed64 = 16;
  optional sint32 f_sint32 = 17;
  optional sint64 f_sint64 = 18;
  optional Inner f_msg = 19;
  repeated int32 unpacked = 20;
  repeated int32 packed = 21 [packed = true];
  repeated sint64 packed_s = 22 [packed = true];
  repeated double packed_d = 23 [packed = true];
  repeated E packed_e = 24 [packed = true];
  repeated string strs = 25;
  repeated Inner msgs = 26;
  map<string, int32> m_str = 27;
  map<int32, string> m_int = 28;
  map<bool, Inner> m_bool = 29;
  map<uint64, bytes> m_u64 = 30;
  oneof first {
    int32 p = 31;
    string q = 32;
  }
  oneof second {
    int32 r = 33;
    Inner s = 34;
  }
  optional int32 late = 35;
  extensions 100 to 200;
}

extend All {
  optional int32 ext_a = 100;
}
